[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mbfd-eoc-api"
version = "1.0.0"
description = "Read-only Miami Beach emergency-management common operating picture API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.18.5",
  "apscheduler==3.11.3",
  "asyncpg==0.31.0",
  "beautifulsoup4==4.14.3",
  "fastapi==0.140.2",
  "geoalchemy2==0.20.0",
  "httpx==0.28.1",
  "orjson==3.11.7",
  "prometheus-client==0.24.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.13.1",
  "python-dateutil==2.9.0.post0",
  "redis==7.1.0",
  "sentry-sdk[fastapi]==2.66.1",
  "shapely==2.1.2",
  "slowapi==0.1.9",
  "sqlalchemy[asyncio]==2.0.51",
  "structlog==26.1.0",
  "uvicorn[standard]==0.42.0"
]

[project.optional-dependencies]
dev = [
  "coverage[toml]==7.13.5",
  "mypy==2.3.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "respx==0.22.0",
  "ruff==0.16.0",
  "testcontainers[postgres,redis]==4.14.1",
  "types-python-dateutil==2.9.0.20260305"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires Docker-backed PostgreSQL and Redis",
  "live: reaches official public upstream services"
]

[tool.coverage.run]
branch = true
source = ["app"]
omit = [
  "app/database.py",
  "app/logging_config.py",
  "app/main.py",
  "app/metrics.py",
  "app/models.py",
  "app/worker.py",
  "app/worker_health.py"
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError"
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "DTZ", "G", "N", "PIE", "PT", "RUF", "S", "SIM"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic/"]

[[tool.mypy.overrides]]
module = ["apscheduler.*", "bs4.*", "geoalchemy2.*", "shapely.*", "slowapi.*"]
ignore_missing_imports = true
